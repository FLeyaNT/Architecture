version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker_services/data/redis:/data
      - ./docker_services/logs/redis:/var/log/redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --logfile /var/log/redis/redis.log
      --loglevel notice
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mypassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: practice01-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:mypassword
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - data-network

  mongo:
    image: mongo:7-jammy
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: testdb
    volumes:
      - ./docker_services/data/mongo:/data/db
      - ./docker_services/logs/mongo:/var/log/mongodb
    command: ["mongod", "--logpath", "/var/log/mongodb/mongod.log", "--bind_ip_all"]
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "admin", "-p", "password", "--authenticationDatabase", "admin", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1-20-alpine3.19
    container_name: practice01-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL:
        mongodb://admin:password@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8082:8081"
    networks:
      - data-network
    depends_on:
      mongo:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
    volumes:
      - ./docker_services/data/neo4j:/data
      - ./docker_services/logs/neo4j:/logs
    networks:
      - data-network

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.0
    container_name: elastic
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=docker-cluster
      - node.name=elastic-node-1
      - xpack.ml.enabled=false
    volumes:
      - ./docker_services/data/elastic:/usr/share/elasticsearch/data
      - ./docker_services/logs/elastic:/usr/share/elasticsearch/logs
    networks:
      - data-network
    deploy:
      resources:
        limits:
          memory: 1G
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -f
        http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
  
  kibana:
    image: kibana:8.16.0
    container_name: practice01-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic:9200
    ports:
      - "5601:5601"
    networks:
      - data-network
    depends_on:
      elastic:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    volumes:
      - ./docker_services/data/postgres:/var/lib/postgresql/data
      - ./docker_services/logs/postgres:/var/log/postgresql
    command: >
      postgres 
      -c logging_collector=on 
      -c log_directory='/var/log/postgresql' 
      -c log_filename='postgresql-%Y-%m-%d_%H%M%S.log' 
      -c log_connections=on 
      -c log_disconnections=on 
      -c log_min_duration_statement=5000
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d practice_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  data-network:
    driver: bridge
